<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register | Personal Site and Guestbook</title>
    <meta
      name="description"
      content="Standalone registration page with account creation, password setup, and jpg/png avatar upload."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="register" data-auth-redirect="index.html#guestbook">
    <div class="page-shell">
      <header class="topbar">
        <div class="topbar-inner">
          <nav class="nav" aria-label="Main navigation">
            <a class="nav-link" href="index.html">HOME</a>
            <a class="nav-link" data-nav-login href="login.html">LOGIN</a>
            <a class="nav-link active" data-nav-register href="register.html">REGISTER</a>
            <button class="nav-link nav-link-button hidden" data-logout-trigger type="button">LOGOUT</button>
          </nav>
        </div>
      </header>

      <main class="auth-main">
        <section class="auth-shell">

          <section class="page-card auth-page-card">
            <h2>REGISTER</h2>


            <form id="register-form" class="form-grid auth-page-form">
              <div class="field">
                <label for="register-username">Username</label>
                <input
                  id="register-username"
                  class="input"
                  name="username"
                  type="text"
                  minlength="3"
                  maxlength="20"
                  pattern="[A-Za-z0-9._-]{3,20}"
                  autocomplete="username"
                  spellcheck="false"
                  placeholder="3 to 20 characters"
                  required
                />
                <p class="helper">Use only letters, numbers, dots, underscores, and hyphens.</p>
              </div>

              <div class="field">
                <label for="register-password">Password</label>
                <input
                  id="register-password"
                  class="input"
                  name="password"
                  type="password"
                  minlength="3"
                  maxlength="20"
                  autocomplete="new-password"
                  placeholder="3 to 20 characters"
                  required
                />
                <p class="helper">Use 3 to 20 characters. Breached passwords are blocked during registration.</p>
              </div>

              <div class="field">
                <label for="register-avatar">Avatar</label>
                <input
                  id="register-avatar"
                  class="file-input"
                  name="avatar"
                  type="file"
                  accept=".jpg,.jpeg,.png,image/jpeg,image/png"
                  required
                />
                <p class="helper">Only jpg, jpeg, or png files are accepted.</p>
              </div>

              <button class="button button-primary" type="submit">Create account</button>
            </form>

            <p class="helper auth-switch">
              Already have an account?
              <a class="inline-link" href="login.html">Go to login</a>
            </p>
          </section>
        </section>
      </main>

      <footer class="footer">
        <div class="footer-card">
          <span id="current-year"></span> Personal Portfolio Assignment Demo
        </div>
      </footer>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="app.js" defer></script>
  </body>
</html>
