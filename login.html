<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>會員登入 | 個人網站與訪客留言板</title>
    <meta
      name="description"
      content="個人網站的獨立會員登入頁面，登入後可回到留言板進行互動。"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="login" data-auth-redirect="index.html#guestbook">
    <div class="page-shell">
      <header class="topbar">
        <div class="topbar-inner">
          <div class="brand">
            <span class="brand-mark">Portfolio Site</span>
            <strong class="brand-title">個人網站與訪客互動系統</strong>
          </div>
          <nav class="nav" aria-label="主要導覽">
            <a class="nav-link" href="index.html">HOME</a>
            <a class="nav-link" href="index.html#about">ABOUT</a>
            <a class="nav-link" href="index.html#guestbook">MESSAGES</a>
            <a class="nav-link active" data-nav-login href="login.html">LOGIN</a>
            <a class="nav-link" data-nav-register href="register.html">REGISTER</a>
            <button class="nav-link nav-link-button hidden" data-logout-trigger type="button">LOGOUT</button>
          </nav>
        </div>
      </header>

      <main class="auth-main">
        <section class="auth-shell">
          <section class="page-card auth-page-card">
            <h2>會員登入</h2>
            <p class="section-copy">
              輸入已註冊的帳號與密碼即可登入。登入驗證由伺服器處理，若還沒有帳號，可直接前往註冊頁面建立。
            </p>

            <form id="login-form" class="form-grid auth-page-form">
              <div class="field">
                <label for="login-username">帳號名稱</label>
                <input
                  id="login-username"
                  class="input"
                  name="username"
                  type="text"
                  placeholder="輸入已註冊帳號"
                  required
                />
              </div>

              <div class="field">
                <label for="login-password">登入密碼</label>
                <input
                  id="login-password"
                  class="input"
                  name="password"
                  type="password"
                  placeholder="輸入你的密碼"
                  required
                />
              </div>

              <button class="button button-primary" type="submit">登入帳號</button>
            </form>

            <p class="helper auth-switch">
              還沒有帳號？
              <a class="inline-link" href="register.html">前往註冊頁</a>
            </p>
          </section>
        </section>
      </main>
      <footer class="footer">
        <div class="footer-card">
          <span id="current-year"></span> Personal Portfolio Assignment Demo
        </div>
      </footer>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="app.js" defer></script>
  </body>
</html>
