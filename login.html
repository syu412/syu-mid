<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Personal Site and Guestbook</title>
    <meta
      name="description"
      content="Standalone login page for the personal website guestbook project."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="login" data-auth-redirect="index.html#guestbook">
    <div class="page-shell">
      <header class="topbar">
        <div class="topbar-inner">

          <nav class="nav" aria-label="Main navigation">
            <a class="nav-link" href="index.html">HOME</a>
            <a class="nav-link active" data-nav-login href="login.html">LOGIN</a>
            <a class="nav-link" data-nav-register href="register.html">REGISTER</a>
            <button class="nav-link nav-link-button hidden" data-logout-trigger type="button">LOGOUT</button>
          </nav>
        </div>
      </header>

      <main class="auth-main">
        <section class="auth-shell">
          <section class="page-card auth-page-card">
            <h2>Login</h2>
            <p class="section-copy">
              Enter your registered username and password to sign in. Authentication is handled by the server. If you do not have an account yet, go to the register page first.
            </p>

            <form id="login-form" class="form-grid auth-page-form">
              <div class="field">
                <label for="login-username">Username</label>
                <input
                  id="login-username"
                  class="input"
                  name="username"
                  type="text"
                  minlength="3"
                  maxlength="20"
                  autocomplete="username"
                  spellcheck="false"
                  placeholder="3 to 20 characters"
                  required
                />
              </div>

              <div class="field">
                <label for="login-password">Password</label>
                <input
                  id="login-password"
                  class="input"
                  name="password"
                  type="password"
                  minlength="3"
                  maxlength="20"
                  autocomplete="current-password"
                  placeholder="3 to 20 characters"
                  required
                />
              </div>

              <button class="button button-primary" type="submit">Log in</button>
            </form>

            <p class="helper auth-switch">
              Don't have an account?
              <a class="inline-link" href="register.html">Go to register</a>
            </p>
          </section>
        </section>
      </main>
      <footer class="footer">
        <div class="footer-card">
          <span id="current-year"></span> Personal Portfolio Assignment Demo
        </div>
      </footer>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="app.js" defer></script>
  </body>
</html>
